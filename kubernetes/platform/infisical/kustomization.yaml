    repo: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    version: 0.11.14
    releaseName: infisical-operator
    namespace: infisical-operator-system
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - connection.yaml
  - auth.yaml
