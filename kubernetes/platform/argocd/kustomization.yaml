---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
  - certificate.yaml
  - ingress.yaml
  - secrets.yaml
  - monitoring.yaml

patches:
  - path: config.yaml
  - path: rbac.yaml
  - path: server.yaml
