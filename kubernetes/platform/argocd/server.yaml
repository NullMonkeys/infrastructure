---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: argocd-server
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  template:
    metadata:
      annotations:
        nullmonkeys.com/sso-provider: authentik
    spec:
      containers:
        - name: argocd-server
          args: [/usr/local/bin/argocd-server, --insecure]
