---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: argocd-server
  annotations:
    external-dns.kubernetes.io/target: ingress.nullmonkeys.com

spec:
  ingressClassName: traefik
  entryPoints:
    - websecure

  routes:
    - kind: Rule
      match: Host(`argocd.nullmonkeys.com`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.nullmonkeys.com`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c

  tls:
    secretName: argocd-public-tls
