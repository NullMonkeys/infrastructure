---
deployment:
  replicas: 3
  dnsPolicy: ClusterFirstWithHostNet

hostNetwork: true

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        topologyKey: kubernetes.io/hostname

service:
  enabled: false

metrics:
  prometheus:
    disableAPICheck: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

ingressClass:
  enabled: true
  name: traefik
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik
    allowCrossNamespace: false
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
    publishedService:
      enabled: false
    ingressEndpoint:
      hostname: ingress.nullmonkeys.com
  kubernetesGateway:
    enabled: false

ports:
  metrics:
    port: 9101
  web:
    port: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
          priority: 1
    forwardedHeaders:
      insecure: false
      trustedIPs: &cloudflareIPv4
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
    proxyProtocol:
      insecure: false
      trustedIPs: []
  websecure:
    port: 443
    forwardedHeaders:
      insecure: false
      trustedIPs: *cloudflareIPv4
    proxyProtocol:
      insecure: false
      trustedIPs: []

securityContext:
  # Host-network listeners need UID 0; the non-root image loses bind capability.
  runAsUser: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]

accessLog:
  enabled: true
