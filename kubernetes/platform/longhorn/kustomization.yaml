---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - authentication.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.13.0
    releaseName: longhorn
    valuesFile: values.yaml
    namespace: longhorn-system
    includeCRDs: true

namespace: longhorn-system

transformers:
  - prerequisite-waves.yaml

patches:
  - target:
      group: batch
      version: v1
      kind: Job
      name: longhorn-pre-upgrade
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-delete-policy
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: Sync
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-1"
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook-delete-policy
        value: BeforeHookCreation,HookSucceeded
