---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kaneo

resources:
  - secrets.yaml
  - postgres/cluster.yaml
  - postgres/backup.yaml

helmCharts:
  - name: kaneo
    repo: oci://ghcr.io/usekaneo/charts
    version: 2.48.0
    releaseName: kaneo
    valuesFile: values.yaml
    namespace: kaneo
    includeCRDs: true

patches:
  # - path: postgres/patch-recovery.yaml
  - path: postgres/patch-init.yaml
