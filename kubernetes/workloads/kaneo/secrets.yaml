---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret

metadata:
  name: kaneo-secrets-sync
  namespace: kaneo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"

spec:
  infisicalAuthRef:
    name: cluster-secrets
    namespace: infisical-operator-system

  syncOptions:
    refreshInterval: 1h
    instantUpdates: false

  sources:
    - projectId: "acbf89d5-1845-4cbe-9e2d-e623806693e8"
      environmentSlug: "prod"
      secretPath: "/k3s/kaneo"

  targets:
    - name: kaneo-secrets
      namespace: kaneo
      kind: Secret
      creationPolicy: Owner
