---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-prometheus-stack

resources:
  - secrets.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: oci://ghcr.io/prometheus-community/charts
    version: 92.16.1
    releaseName: kube-prometheus-stack
    valuesFile: values.yaml
    namespace: kube-prometheus-stack
    includeCRDs: true
