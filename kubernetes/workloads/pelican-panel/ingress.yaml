---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pelican-panel-ingress
  namespace: pelican-panel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.kubernetes.io/target: ingress.nullmonkeys.com
    argocd.argoproj.io/sync-wave: "1"

spec:
  tls:
    - secretName: pelican-panel-tls-secret
      hosts:
        - pelican.nullmonkeys.com

  rules:
    - host: pelican.nullmonkeys.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pelican-panel-svc
                port:
                  number: 80
