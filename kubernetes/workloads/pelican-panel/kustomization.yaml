---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pelican-panel

resources:
  - deployment.yaml
  - ingress.yaml
  - pvc.yaml
  - secrets.yaml
  - svc.yaml
  - postgres/cluster.yaml
  - postgres/backup.yaml

patches:
  - path: postgres/patch-init.yaml
  # - path: postgres/patch-recovery.yaml

helmCharts:
  - name: redis
    repo: https://charts.bitnami.com/bitnami
    version: 28.3.1
    releaseName: redis
    namespace: pelican-panel
    valuesFile: redis/values.yaml
