---
global:
  deploymentAnnotations:
    argocd.argoproj.io/sync-wave: "1"

  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: secret-key

    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-db-app
          key: password

    - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__HOST
      value: "authentik-db-ro"
    - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__NAME
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__USER
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-db-app
          key: password

    - name: AUTHENTIK_STORAGE__BACKEND
      value: "s3"
    - name: AUTHENTIK_STORAGE__S3__ENDPOINT
      value: "https://s3.eu-central-003.backblazeb2.com"
    - name: AUTHENTIK_STORAGE__S3__REGION
      value: "eu-central-003"
    - name: AUTHENTIK_STORAGE__S3__BUCKET_NAME
      value: "nm-authentik"
    - name: AUTHENTIK_STORAGE__S3__ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: backblaze-b2-uploads-access-key
    - name: AUTHENTIK_STORAGE__S3__SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: backblaze-b2-uploads-secret-key

    - name: AUTHENTIK_EMAIL__USERNAME
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: smtp-username
    - name: AUTHENTIK_EMAIL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: smtp-password

    - name: AUTHENTIK_LISTEN__HTTP
      value: "0.0.0.0:9000"
    - name: AUTHENTIK_LISTEN__HTTPS
      value: "0.0.0.0:9443"
    - name: AUTHENTIK_LISTEN__METRICS
      value: "0.0.0.0:9300"


authentik:
  enabled: true

  postgresql:
    host: "authentik-db-rw"
    name: "authentik"
    user: "authentik"

  email:
    host: "smtp.resend.com"
    port: 587
    use_tls: true
    from: "auth@nullmonkeys.com"

postgresql:
  enabled: false

server:
  enabled: true
  replicas: 2
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "4Gi"

  ingress:
    enabled: true
    ingressClassName: traefik

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.kubernetes.io/target: ingress.nullmonkeys.com

    hosts:
      - auth.nullmonkeys.com

    tls:
      - hosts:
          - auth.nullmonkeys.com
        secretName: authentik-tls

worker:
  enabled: true
  replicas: 2
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "4Gi"
