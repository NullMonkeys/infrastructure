---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: pelican-panel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  project: infrastructure

  destination:
    server: https://kubernetes.default.svc
    namespace: pelican-panel

  source:
    repoURL: https://github.com/NullMonkeys/infrastructure.git
    targetRevision: main
    path: kubernetes/workloads/pelican-panel

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
