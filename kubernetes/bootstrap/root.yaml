---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cluster
  namespace: argocd

spec:
  project: infrastructure

  source:
    repoURL: https://github.com/NullMonkeys/infrastructure.git
    targetRevision: main
    path: kubernetes/bootstrap/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
