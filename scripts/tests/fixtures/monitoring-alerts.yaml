---
evaluation_interval: 1m
tests:
  - name: primary without WAL receiver is healthy
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="authentik",pod="synthetic-db-primary"}'
        values: '0+0x10'
      - series: 'cnpg_pg_replication_in_recovery{namespace="authentik",pod="synthetic-db-primary"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: AuthentikDatabaseReplicationDisconnected
        exp_alerts: []
  - name: standby without WAL receiver fires after five minutes
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_is_wal_receiver_up{namespace="authentik",pod="synthetic-db-standby"}'
        values: '0+0x10'
      - series: 'cnpg_pg_replication_in_recovery{namespace="authentik",pod="synthetic-db-standby"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: AuthentikDatabaseReplicationDisconnected
        exp_alerts: []
      - eval_time: 5m
        alertname: AuthentikDatabaseReplicationDisconnected
        exp_alerts:
          - exp_labels:
              namespace: authentik
              pod: synthetic-db-standby
              severity: warning
            exp_annotations:
              summary: Authentik standby synthetic-db-standby has lost its WAL receiver
              description: "The primary legitimately has no WAL receiver; this alert selects only standby instances. Inspect replication connectivity and CNPG reconciliation."
  - name: degraded volume waits ten minutes and deduplicates exporter series
    interval: 1m
    input_series:
      - series: 'longhorn_volume_robustness{namespace="longhorn-system",volume="synthetic-volume",pvc="data",pvc_namespace="example",state="degraded",instance="192.0.2.1:9500"}'
        values: '1+0x20'
      - series: 'longhorn_volume_robustness{namespace="longhorn-system",volume="synthetic-volume",pvc="data",pvc_namespace="example",state="degraded",instance="192.0.2.2:9500"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: LonghornVolumeDegraded
        exp_alerts: []
      - eval_time: 10m
        alertname: LonghornVolumeDegraded
        exp_alerts:
          - exp_labels:
              namespace: longhorn-system
              volume: synthetic-volume
              pvc: data
              pvc_namespace: example
              severity: warning
            exp_annotations:
              summary: Longhorn volume synthetic-volume has degraded replicas
              description: Inspect replica health and scheduling for example/data.
  - name: healthy state must not trigger degradation or fault alerts
    interval: 1m
    input_series:
      - series: 'longhorn_volume_robustness{namespace="longhorn-system",volume="synthetic-volume",state="healthy"}'
        values: '1+0x20'
      - series: 'longhorn_volume_robustness{namespace="longhorn-system",volume="synthetic-volume",state="degraded"}'
        values: '0+0x20'
      - series: 'longhorn_volume_robustness{namespace="longhorn-system",volume="synthetic-volume",state="faulted"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: LonghornVolumeDegraded
        exp_alerts: []
      - eval_time: 20m
        alertname: LonghornVolumeFaulted
        exp_alerts: []
  - name: faulted volume is critical after two minutes
    interval: 1m
    input_series:
      - series: 'longhorn_volume_robustness{namespace="longhorn-system",volume="synthetic-volume",pvc="data",pvc_namespace="example",state="faulted"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: LonghornVolumeFaulted
        exp_alerts: []
      - eval_time: 2m
        alertname: LonghornVolumeFaulted
        exp_alerts:
          - exp_labels:
              namespace: longhorn-system
              volume: synthetic-volume
              pvc: data
              pvc_namespace: example
              severity: critical
            exp_annotations:
              summary: Longhorn volume synthetic-volume is faulted
              description: The volume has no healthy replica available; inspect Longhorn before attempting recovery.
  - name: recent backup is healthy but becomes stale after thirty six hours
    interval: 1m
    input_series:
      - series: 'cnpg_collector_last_available_backup_timestamp{namespace="authentik",pod="synthetic-db-1"}'
        values: '600+0x2400'
    alert_rule_test:
      - eval_time: 36h
        alertname: AuthentikDatabaseBackupStale
        exp_alerts: []
      - eval_time: 38h
        alertname: AuthentikDatabaseBackupStale
        exp_alerts:
          - exp_labels:
              namespace: authentik
              severity: critical
            exp_annotations:
              summary: Authentik has no successful database backup within 36 hours
              description: "Check the daily ScheduledBackup, CNPG exporter, and B2 access. A zero timestamp means no completed base backup; WAL archiving alone does not satisfy this alert."
  - name: missing backup metric is an error rather than a healthy empty result
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 29m
        alertname: AuthentikDatabaseBackupStale
        exp_alerts: []
      - eval_time: 30m
        alertname: AuthentikDatabaseBackupStale
        exp_alerts:
          - exp_labels:
              namespace: authentik
              severity: critical
            exp_annotations:
              summary: Authentik has no successful database backup within 36 hours
              description: "Check the daily ScheduledBackup, CNPG exporter, and B2 access. A zero timestamp means no completed base backup; WAL archiving alone does not satisfy this alert."
  - name: low traffic error bursts do not page
    interval: 1m
    input_series:
      - series: 'traefik_entrypoint_requests_total{namespace="traefik",entrypoint="websecure",code="500"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: TraefikHighServerErrorRate
        exp_alerts: []
  - name: sustained server errors with traffic trigger a warning
    interval: 1m
    input_series:
      - series: 'traefik_entrypoint_requests_total{namespace="traefik",entrypoint="websecure",code="200"}'
        values: '0+600x30'
      - series: 'traefik_entrypoint_requests_total{namespace="traefik",entrypoint="websecure",code="500"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: TraefikHighServerErrorRate
        exp_alerts: []
      - eval_time: 15m
        alertname: TraefikHighServerErrorRate
        exp_alerts:
          - exp_labels:
              namespace: traefik
              entrypoint: websecure
              severity: warning
            exp_annotations:
              summary: Traefik websecure returns more than 5% server errors
              description: "Inspect upstream application health and ingress routing. The threshold excludes entrypoints below 0.1 requests/second."
