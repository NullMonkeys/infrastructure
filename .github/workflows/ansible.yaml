name: Ansible checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ansible-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Ansible
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ansible
        run: python -m pip install -r ansible/requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/collections/requirements.yml

      - name: Validate inventory and Ansible configuration
        env:
          ANSIBLE_INVENTORY_BIN: ansible-inventory
        run: python -m unittest discover -s scripts/tests -v
