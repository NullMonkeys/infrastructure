# Managed by Ansible. Keep other boot options and replace only ipv6.disable.
GRUB_CMDLINE_LINUX="$(printf '%s\n' "${GRUB_CMDLINE_LINUX:-}" | sed -E 's/(^|[[:space:]])ipv6\.disable=[^[:space:]]+//g') ipv6.disable=1"
GRUB_CMDLINE_LINUX_DEFAULT="$(printf '%s\n' "${GRUB_CMDLINE_LINUX_DEFAULT:-}" | sed -E 's/(^|[[:space:]])ipv6\.disable=[^[:space:]]+//g')"
